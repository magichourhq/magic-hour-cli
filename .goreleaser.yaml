version: 2
project_name: mh
before:
  hooks:
    - go generate ./...
    - make completions
builds:
  - id: mh
    main: ./cmd/mh
    binary: mh
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.txt
      - README.md
      - completions/*
source:
  enabled: true
  name_template: '{{ .ProjectName }}_{{ .Version }}_source'
  prefix_template: '{{ .ProjectName }}-{{ .Version }}/'
checksum:
  name_template: checksums.txt
snapshot:
  version_template: '{{ incpatch .Version }}-dev'
changelog:
  use: github-native
release:
  prerelease: auto
  github:
    owner: magichourhq
    name: cli
scoops:
  - name: mh
    homepage: https://github.com/magichourhq/cli
    description: Generate images, video, and audio with Magic Hour
    license: MIT
    skip_upload: true
    repository:
      owner: magichourhq
      name: cli
nfpms:
  - id: packages
    package_name: magic-hour-cli
    homepage: https://github.com/magichourhq/cli
    maintainer: Magic Hour
    description: Generate images, video, and audio with Magic Hour
    license: MIT
    formats: [deb, rpm, apk]
    contents:
      - src: completions/mh.bash
        dst: /usr/share/bash-completion/completions/mh
      - src: completions/mh.zsh
        dst: /usr/share/zsh/site-functions/_mh
      - src: completions/mh.fish
        dst: /usr/share/fish/vendor_completions.d/mh.fish
      - src: LICENSE
        dst: /usr/share/doc/magic-hour-cli/LICENSE
      - src: THIRD_PARTY_NOTICES.txt
        dst: /usr/share/doc/magic-hour-cli/THIRD_PARTY_NOTICES.txt
