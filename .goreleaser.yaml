version: 2
project_name: mh
before:
  hooks:
    - make completions
builds:
  - id: mh
    main: ./cmd/mh
    binary: mh
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.txt
      - README.md
      - completions/*
nfpms:
  - package_name: magic-hour-cli
    ids: [mh]
    formats: [deb, rpm]
    file_name_template: '{{ .ConventionalFileName }}'
    vendor: Magic Hour
    homepage: https://github.com/magichourhq/magic-hour-cli
    maintainer: Magic Hour <support@magichour.ai>
    description: Magic Hour command-line tool
    license: MIT
    section: utils
    contents:
      - src: LICENSE
        dst: /usr/share/doc/magic-hour-cli/copyright
        packager: deb
      - src: LICENSE
        dst: /usr/share/licenses/magic-hour-cli/LICENSE
        packager: rpm
checksum:
  name_template: checksums.txt
changelog:
  use: github-native
release:
  prerelease: auto
  github:
    owner: magichourhq
    name: magic-hour-cli
