name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'magichourhq/cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go generate ./...
      - run: git diff --exit-code
      - run: go vet ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Homebrew and Scoop definitions
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/homebrew.py "${RELEASE_TAG#v}"
          git fetch origin main
          git switch --detach origin/main
          mkdir -p Formula bucket
          cp dist/mh.rb Formula/mh.rb
          cp dist/scoop/mh.json bucket/mh.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/mh.rb bucket/mh.json
          if ! git diff --cached --quiet; then
            git commit -m "Update installers for ${RELEASE_TAG}"
            git push origin HEAD:main
          fi
