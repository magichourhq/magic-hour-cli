name: Release
on:
  push:
    branches: [main]
    paths: [VERSION]
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'magichourhq/magic-hour-cli'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check version change
        id: version
        shell: bash
        env:
          PREVIOUS_COMMIT: ${{ github.event.before }}
        run: |
          version=$(cat VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must be a semantic version without the v prefix" >&2
            exit 1
          fi
          if previous=$(git show "$PREVIOUS_COMMIT:VERSION" 2>/dev/null) && [ "$version" != "$previous" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "number=$version" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.release == 'true'
        with:
          go-version-file: go.mod
      - if: steps.version.outputs.release == 'true'
        run: go generate ./...
      - if: steps.version.outputs.release == 'true'
        run: git diff --exit-code
      - if: steps.version.outputs.release == 'true'
        run: go vet ./...
      - if: steps.version.outputs.release == 'true'
        run: go test ./...
      - name: Tag release
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: steps.version.outputs.release == 'true'
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.number }}

  update-homebrew:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Check tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN" || { echo "HOMEBREW_TAP_TOKEN is required" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cli
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: magichourhq/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v$RELEASE_VERSION" --repo magichourhq/magic-hour-cli --pattern checksums.txt --dir "$RUNNER_TEMP"
          python3 cli/scripts/update-homebrew.py "$RELEASE_VERSION" "$RUNNER_TEMP/checksums.txt" tap/Formula/mh.rb
          if git -C tap diff --quiet -- Formula/mh.rb; then
            echo "Formula already matches v$RELEASE_VERSION"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: update
      - name: Open tap PR
        if: steps.update.outputs.changed == 'true'
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          branch="chore/mh-$RELEASE_VERSION"
          if [ "$(gh pr list --repo magichourhq/homebrew-tap --head "$branch" --state open --json number --jq length)" != 0 ]; then
            echo "Tap PR already open for v$RELEASE_VERSION"
            exit 0
          fi
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mh.rb
          git commit -m "chore: update mh to v$RELEASE_VERSION"
          git push origin "$branch"
          printf 'Update mh formula to v%s using release checksums.\n' "$RELEASE_VERSION" > "$RUNNER_TEMP/tap-pr.md"
          gh pr create --repo magichourhq/homebrew-tap --base main --head "$branch" --title "chore: update mh to v$RELEASE_VERSION" --body-file "$RUNNER_TEMP/tap-pr.md"
